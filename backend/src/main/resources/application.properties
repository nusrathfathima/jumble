# --- Application identity ---
spring.application.name=jumble-backend

# --- Server ---
# 8080 is Spring Boot's default; listed explicitly so it's easy to find
# and change later (e.g. if something else on your machine is using it).
server.port=8080

# --- Database ---
# Deliberately left unconfigured here. Database connection details contain
# a password and do not belong in a file that gets committed to GitHub.
# They're supplied as environment variables instead — see backend/README.md
# for how to set these when we reach the database-connection step.
#
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
