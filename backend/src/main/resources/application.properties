# --- Application identity ---
spring.application.name=jumble-backend

# --- Server ---
# Hosting platforms like Render tell the app which port to listen on via
# the PORT environment variable; locally there is no PORT, so it falls
# back to 8080.
server.port=${PORT:8080}

# --- Database ---
# Deliberately left unconfigured here. Database connection details contain
# a password and do not belong in a file that gets committed to GitHub.
# They're supplied as environment variables instead — see backend/README.md
# for how to set these when we reach the database-connection step.
#
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Flyway owns the schema; Hibernate should only verify entities match it,
# never create or alter tables itself.
spring.jpa.hibernate.ddl-auto=validate

# --- JWT ---
# jwt.secret is the key tokens are signed and verified with — anyone who
# has it can forge a valid token for any parent id, so it's an environment
# variable, never a literal value in this file. Generate one with:
#   openssl rand -base64 32
# and set it as JWT_SECRET (see README.md). No default here on purpose —
# a missing JWT_SECRET should fail startup loudly, not silently fall back
# to something guessable.
jwt.secret=${JWT_SECRET}

# 24 hours.
jwt.expiration-ms=86400000

# --- Database connection pool ---
# Neon's free database goes to sleep after 5 idle minutes and drops its
# connections when it does. Keeping zero idle connections (and retiring
# spare ones after a minute) means the app never holds a dead connection
# from before the nap, and the small pool keeps memory use low on a free
# 512 MB server.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000

# --- CORS ---
# Websites allowed to call this API from a browser, comma-separated.
# Locally that is the Vite dev server; in production set the
# CORS_ALLOWED_ORIGINS environment variable to the real frontend URL.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Memory ---
# Free hosting tiers have very little RAM; tell Tomcat not to keep large
# spare thread pools around.
server.tomcat.threads.max=20
