# --- Application identity ---
spring.application.name=jumble-backend

# --- Server ---
# 8080 is Spring Boot's default; listed explicitly so it's easy to find
# and change later (e.g. if something else on your machine is using it).
server.port=8080

# --- Database ---
# Deliberately left unconfigured here. Database connection details contain
# a password and do not belong in a file that gets committed to GitHub.
# They're supplied as environment variables instead — see backend/README.md
# for how to set these when we reach the database-connection step.
#
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Flyway owns the schema; Hibernate should only verify entities match it,
# never create or alter tables itself.
spring.jpa.hibernate.ddl-auto=validate

# --- JWT ---
# jwt.secret is the key tokens are signed and verified with — anyone who
# has it can forge a valid token for any parent id, so it's an environment
# variable, never a literal value in this file. Generate one with:
#   openssl rand -base64 32
# and set it as JWT_SECRET (see README.md). No default here on purpose —
# a missing JWT_SECRET should fail startup loudly, not silently fall back
# to something guessable.
jwt.secret=${JWT_SECRET}

# 24 hours.
jwt.expiration-ms=86400000